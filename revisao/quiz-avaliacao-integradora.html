<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão Algoritmos | Revisão AI</title><style>:root{font-family:system-ui,sans-serif;color:#f1f5ff;background:#090e22}body{margin:0;background:radial-gradient(ellipse at top,#263b79,#090e22 70%);min-height:100vh}.wrap{max-width:840px;margin:auto;padding:28px 18px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(1.8rem,5vw,3rem);margin:20px 0 6px}.sub{color:#bcc9ee}.pill{background:#253760;padding:9px 14px;border-radius:30px}.card{background:#151e3d;border:1px solid #40528a;border-radius:24px;padding:24px;margin-top:25px;box-shadow:0 15px 45px #0005}.bar{height:11px;background:#303d66;border-radius:20px;overflow:hidden}.bar div{height:100%;background:linear-gradient(90deg,#24e4bd,#9a8cff);transition:width .3s}button{font:inherit;cursor:pointer}.option{display:block;width:100%;text-align:left;background:#222e55;color:#fff;border:1px solid #4b5c8c;border-radius:14px;padding:16px;margin:12px 0;line-height:1.5}.option:hover:not(:disabled){border-color:#56e4cc;background:#2d416f}.option.correct{background:#145844;border-color:#35e0a4}.option.wrong{background:#713244;border-color:#ff7a9e}.option:disabled{cursor:default}.primary{border:0;background:#69ebcb;color:#092b34;font-weight:800;padding:14px 24px;border-radius:14px;margin-top:15px}.secondary{border:1px solid #8395c8;background:transparent;color:white;padding:10px;border-radius:12px}.feedback{padding:14px;border-left:4px solid #69ebcb;background:#253455;border-radius:8px;margin-top:18px}.hidden{display:none}#question{font-size:1.25rem;white-space:pre-wrap;line-height:1.6}small{color:#c5d3ef}footer{margin:25px 0;color:#b8c4e7;text-align:center}@media(prefers-reduced-motion:reduce){*{transition:none!important}}</style></head><body><div class="wrap"><header><span class="pill">UNIG • Revisão interativa</span><button id="sound" class="secondary" aria-label="Alternar áudio">🔊 Áudio ligado</button></header><h1>🚀 Missão Algoritmos</h1><p class="sub">Avaliação Integradora • 10 desafios inéditos • VisualG • Feedback comentado</p><div class="card"><div style="display:flex;justify-content:space-between"><strong id="progress">Desafio 1 de 10</strong><strong id="score">0 pontos</strong></div><p class="bar"><div id="fill" style="width:0%"></div></p><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="primary hidden">Próximo desafio →</button></div><footer>Material de estudo com questões semelhantes, não idênticas, à avaliação. Os gabaritos oficiais não são publicados.</footer></div><script>const questions=[["Um cadastro registra quantidade inteira, preço com centavos, nome textual e uma taxa fixa. Qual declaração está correta?",["const TAXA = 0.07; quantidade: real; preco: inteiro; nome: caractere","const TAXA = 0.07; quantidade: inteiro; preco: real; nome: caractere","TAXA: real; quantidade: inteiro; preco: real; nome: caractere","const TAXA = 0.07; quantidade: inteiro; preco: caractere; nome: real"],1,"Uma constante não muda; inteiro representa contagem, real representa valores decimais e caractere representa texto."],["Um mercado examina 150 itens e concede desconto apenas a preços acima de R$ 80. Complete o laço e a condição.",["para i de 1 ate 149 faca; preco > 80; fimpara","para i de 1 ate 150 faca; preco >= 80; fimpara","para i de 1 ate 150 faca; preco < 80; fimpara","para i de 1 ate 150 faca; preco > 80; fimpara"],3,"O laço deve executar 150 vezes; acima de 80 significa > 80, não >= 80."],["Qual saída? total <- 0; PARA etapa DE 1 ATE 5 FACA; total <- total + (etapa * 4); FIMPARA; ESCREVA(total)",["60","40","48","80"],0,"Some 4 + 8 + 12 + 16 + 20 = 60."],["Qual saída? codigo <- 2; soma <- 0; ENQUANTO codigo <= 14 FACA; soma <- soma + codigo; codigo <- codigo + 3; FIMENQUANTO; ESCREVA(soma)",["30","40","42","54"],1,"Os códigos somados são 2, 5, 8, 11 e 14: total 40."],["ESCOLHA(opcao): opção 1 = quantidade * preço; opção 2 = quantidade * preço * 0.85; opção 3 = quantidade * preço * 1.15. Para opção 2, quantidade 5 e preço R$ 40, qual total?",["R$ 160,00","R$ 185,00","R$ 170,00","R$ 230,00"],2,"5 × 40 = 200; desconto de 15%: 200 × 0,85 = 170."],["Um sistema guarda idade, altura com casas decimais, aprovado (verdadeiro/falso) e um limite fixo de 18. Qual opção corresponde aos tipos?",["idade: real; altura: inteiro; aprovado: logico; const LIMITE = 18","idade: inteiro; altura: real; aprovado: logico; const LIMITE = 18","idade: inteiro; altura: caractere; aprovado: real; LIMITE: inteiro","idade: caractere; altura: real; aprovado: inteiro; const LIMITE = 18"],1,"Idade inteira, altura real, aprovado lógico e LIMITE constante."],["Um laço PARA de 1 até 80 verifica valores. Apenas valores maiores que R$ 200 recebem desconto de 20%. Qual combinação está correta?",["para i de 1 ate 80 faca; valor > 200; final <- valor * 0.80; fimpara","para i de 1 ate 79 faca; valor > 200; final <- valor * 0.80; fimpara","para i de 1 ate 80 faca; valor >= 200; final <- valor * 0.80; fimpara","para i de 1 ate 80 faca; valor > 200; final <- valor * 1.20; fimpara"],0,"São 80 iterações; > 200 exclui 200; multiplicar por 0,80 reduz 20%."],["Qual saída? pontos <- 0; PARA n DE 1 ATE 4 FACA; pontos <- pontos + (n * 5); FIMPARA; ESCREVA(pontos)",["40","45","50","60"],2,"5 + 10 + 15 + 20 = 50."],["Qual saída? numero <- 1; total <- 0; ENQUANTO numero <= 11 FACA; total <- total + numero; numero <- numero + 2; FIMENQUANTO; ESCREVA(total)",["25","30","36","42"],2,"1 + 3 + 5 + 7 + 9 + 11 = 36."],["ESCOLHA(opcao): CASO 1: total <- qtd * unitario; CASO 2: total <- qtd * unitario * 0.90; CASO 3: total <- qtd * unitario * 1.10. Se opcao = 3, qtd = 3 e unitario = 50, qual total?",["R$ 135,00","R$ 150,00","R$ 155,00","R$ 165,00"],3,"3 × 50 = 150; o caso 3 acrescenta 10%, produzindo R$ 165."]];let i=0,points=0,enabled=true,ctx;const $=id=>document.getElementById(id);function beep(ok){if(!enabled)return;try{ctx??=new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type=ok?'sine':'triangle';o.frequency.setValueAtTime(ok?660:230,ctx.currentTime);o.frequency.exponentialRampToValueAtTime(ok?880:170,ctx.currentTime+.15);g.gain.setValueAtTime(.075,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.25);o.start();o.stop(ctx.currentTime+.26)}catch(e){}}function render(){if(i>=questions.length){$('progress').textContent='Missão concluída!';$('fill').style.width='100%';$('question').textContent='🏆 Você conquistou '+points+' de '+questions.length*10+' pontos!';$('answers').innerHTML='';$('feedback').classList.remove('hidden');$('feedback').textContent=points>=80?'Excelente! Você está avançando na interpretação de algoritmos.':'Revise as explicações e tente novamente para melhorar sua pontuação.';$('next').textContent='Jogar novamente ↻';$('next').classList.remove('hidden');return}let q=questions[i];$('progress').textContent='Desafio '+(i+1)+' de '+questions.length;$('fill').style.width=(i/questions.length*100)+'%';$('question').textContent=q[0];$('answers').innerHTML='';$('feedback').classList.add('hidden');$('next').classList.add('hidden');q[1].forEach((a,j)=>{let b=document.createElement('button');b.className='option';b.textContent='ABCD'[j]+') '+a;b.onclick=()=>choose(j);$('answers').appendChild(b)})}function choose(j){let q=questions[i],ok=j===q[2];if(ok)points+=10;$('score').textContent=points+' pontos';beep(ok);[...$('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('feedback').textContent=(ok?'✓ Resposta correta! ':'✕ Vamos revisar: ')+q[3];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden')} $('next').onclick=()=>{if(i>=questions.length){i=0;points=0;$('score').textContent='0 pontos'}else i++;render()};$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent=enabled?'🔊 Áudio ligado':'🔇 Áudio desligado'};render();</script></body></html>
